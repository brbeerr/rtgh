<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MeshVPN Desktop</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <div id="screen-home" class="screen active">
      <div class="header">
        <h1>MeshVPN</h1>
        <p class="subtitle">Virtual Network for Desktop</p>
      </div>
      <div class="actions">
        <button class="btn btn-primary" onclick="showScreen('screen-create')">Create Room</button>
        <button class="btn btn-secondary" onclick="showScreen('screen-join')">Join by Key</button>
        <button class="btn btn-outline" onclick="showScreen('screen-servers')">Servers</button>
      </div>
    </div>
    <div id="screen-servers" class="screen">
      <div class="header"><button class="btn-back" onclick="showScreen('screen-home')">&larr;</button><h2>Free Servers</h2></div>
      <div id="server-list" class="server-list"></div>
    </div>
    <div id="screen-create" class="screen">
      <div class="header"><button class="btn-back" onclick="showScreen('screen-home')">&larr;</button><h2>Create Room</h2></div>
      <div class="form">
        <input type="text" id="create-name" placeholder="Room name" maxlength="30">
        <input type="text" id="create-username" placeholder="Your nickname" maxlength="20">
        <button class="btn btn-primary" onclick="createRoom()">Create</button>
      </div>
    </div>
    <div id="screen-join" class="screen">
      <div class="header"><button class="btn-back" onclick="showScreen('screen-home')">&larr;</button><h2>Join Room</h2></div>
      <div class="form">
        <input type="text" id="join-key" placeholder="Room key (8 chars)" maxlength="8" style="text-transform:uppercase;letter-spacing:3px;text-align:center;font-size:1.4em;">
        <input type="text" id="join-username" placeholder="Your nickname" maxlength="20">
        <button class="btn btn-primary" onclick="joinRoom()">Connect</button>
      </div>
    </div>
    <div id="screen-room" class="screen">
      <div class="room-header">
        <div class="room-info"><h3 id="room-name"></h3><span id="room-key-display" class="room-key" onclick="copyKey()"></span></div>
        <button class="btn-leave" onclick="leaveRoom()">Leave</button>
      </div>
      <div class="room-tabs">
        <button class="tab active" onclick="switchTab('chat')">Chat</button>
        <button class="tab" onclick="switchTab('members')">Members <span id="members-count">0</span></button>
      </div>
      <div id="tab-chat" class="tab-content active">
        <div id="chat-messages" class="chat-messages"></div>
        <div class="chat-input">
          <input type="text" id="chat-text" placeholder="Message..." maxlength="500" onkeydown="if(event.key==='Enter')sendMessage()">
          <button onclick="sendMessage()">&#9654;</button>
        </div>
      </div>
      <div id="tab-members" class="tab-content">
        <div id="members-list" class="members-list"></div>
      </div>
    </div>
  </div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
