name: Build Android APK

on:
  push:
    branches: [ mesh-vpn-android ]
  pull_request:
    branches: [ mesh-vpn-android ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Grant execute permission for gradlew
      run: chmod +x mesh-vpn-android/gradlew
      
    - name: Create gradlew
      run: |
        cd mesh-vpn-android
        gradle wrapper --gradle-version 8.4

    - name: Build Debug APK
      run: |
        cd mesh-vpn-android
        ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MeshVPN-debug
        path: mesh-vpn-android/app/build/outputs/apk/debug/app-debug.apk
