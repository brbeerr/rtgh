name: Build MeshVPN

on:
  push:
    branches: [ mesh-vpn-android ]
  pull_request:
    branches: [ mesh-vpn-android ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.4'
    - name: Build Debug APK
      working-directory: mesh-vpn-android
      run: gradle assembleDebug --no-daemon
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: MeshVPN-Android-debug
        path: mesh-vpn-android/app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install dependencies
      working-directory: mesh-vpn
      run: npm install
    - name: Build Windows exe
      working-directory: mesh-vpn
      run: npx electron-builder --win --publish never
    - name: Upload Windows exe
      uses: actions/upload-artifact@v4
      with:
        name: MeshVPN-Windows-Setup
        path: mesh-vpn/dist/*.exe
        if-no-files-found: error
